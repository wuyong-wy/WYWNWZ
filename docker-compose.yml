version: "3.8"

services:
  # === Saleor Core ===
  saleor-api:
    image: ghcr.io/saleor/saleor:3.20.3
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://saleor:${SALEOR_DB_PASSWORD}@db-saleor:5432/saleor
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DEFAULT_CHANNEL=default-channel
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
    depends_on:
      db-saleor:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - saleor-media:/app/media

  # === Saleor Dashboard ===
  saleor-dashboard:
    image: ghcr.io/saleor/saleor-dashboard:latest
    restart: always
    ports:
      - "127.0.0.1:9000:80"
    environment:
      - API_URL=https://${API_DOMAIN}/graphql/

  # === FastAPI 自定义服务 ===
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fastapi:${FASTAPI_DB_PASSWORD}@db-fastapi:5432/fastapi
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      db-fastapi:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fastapi:/app

  # === Celery Worker（独立配置，不加载 FastAPI 路由）===
  celery-worker:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: always
    command: celery -A celery_config worker -l info -Q default,email,ai --concurrency=4
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fastapi:${FASTAPI_DB_PASSWORD}@db-fastapi:5432/fastapi
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      db-fastapi:
        condition: service_healthy
      redis:
        condition: service_healthy

  # === Celery Beat ===
  celery-beat:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: always
    command: celery -A celery_config beat -l info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fastapi:${FASTAPI_DB_PASSWORD}@db-fastapi:5432/fastapi
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  # === PostgreSQL (Saleor) ===
  db-saleor:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=${SALEOR_DB_PASSWORD}
      - POSTGRES_DB=saleor
    volumes:
      - saleor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === PostgreSQL (FastAPI) — 独立数据库 ===
  db-fastapi:
    image: postgres:16-alpine
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=fastapi
      - POSTGRES_PASSWORD=${FASTAPI_DB_PASSWORD}
      - POSTGRES_DB=fastapi
    volumes:
      - fastapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Redis ===
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === MeiliSearch（阶段 3 引入，MVP 阶段注释掉）===
  # meilisearch:
  #   image: getmeili/meilisearch:v1.12
  #   restart: always
  #   ports:
  #     - "127.0.0.1:7700:7700"
  #   environment:
  #     - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
  #     - MEILI_ENV=production
  #   volumes:
  #     - meili-data:/meili_data

  # === Nginx ===
  nginx:
    image: nginx:1.26-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - saleor-api
      - fastapi
      - saleor-dashboard

volumes:
  saleor-media:
  saleor-db-data:
  fastapi-db-data:
  redis-data:
  # meili-data:
