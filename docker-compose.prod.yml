# docker-compose.prod.yml — 生产环境覆盖配置
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # === FastAPI — 生产模式 ===
  fastapi:
    volumes: []  # 覆盖开发环境的 volume 挂载，使用镜像内代码
    environment:
      - DEBUG=false
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # === Celery Worker — 生产模式 ===
  celery-worker:
    volumes: []
    environment:
      - DEBUG=false
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # === Celery Beat — 生产模式 ===
  celery-beat:
    volumes: []
    environment:
      - DEBUG=false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # === Saleor API — 生产模式 ===
  saleor-api:
    environment:
      - DEBUG=false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # === Nginx — 生产模式 ===
  nginx:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  # === PostgreSQL (Saleor) — 生产调优 ===
  db-saleor:
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c max_connections=100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # === PostgreSQL (FastAPI) — 生产调优 ===
  db-fastapi:
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c max_connections=50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # === Redis — 生产调优 ===
  redis:
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --save 300 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
